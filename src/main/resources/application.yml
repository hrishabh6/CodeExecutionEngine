server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: code-execution-service
  
  # Redis Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:5000ms}


# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: when_authorized

# Execution Service Configuration
execution:
  backend: ${EXECUTION_BACKEND:worker-pod}
  mode: ${EXECUTION_MODE:worker}
  worker:
    count: ${WORKER_COUNT:5}
    queue-capacity: ${EXECUTION_WORKER_QUEUE_CAPACITY:100}
    timeout-seconds: ${EXECUTION_TIMEOUT_SECONDS:10}
    poll-timeout-seconds: ${EXECUTION_POLL_TIMEOUT_SECONDS:5}
  job:
    payload-b64: ${EXECUTION_JOB_PAYLOAD_B64:}
  queue:
    name: execution:queue
    status-prefix: "execution:status"
    status-ttl-seconds: 3600
    job-result-prefix: "execution:job-result:"
    job-result-ttl-seconds: ${KUBERNETES_JOB_RESULT_TTL_SECONDS:600}
    playground-job-result-prefix: ${EXECUTION_PLAYGROUND_JOB_RESULT_PREFIX:execution:playground-job-result:}
  complexity-profile:
    enabled: ${EXECUTION_COMPLEXITY_PROFILE_ENABLED:false}
    internal-service-token: ${INTERNAL_SERVICE_TOKEN:}
    internal-auth-require-token: ${EXECUTION_COMPLEXITY_PROFILE_INTERNAL_AUTH_REQUIRE_TOKEN:false}
    harness-version: v1
    measurement-policy-version: v1
    queue:
      name: execution:complexity-profile:queue
      status-prefix: execution:complexity-profile:status:
      result-prefix: execution:complexity-profile:result:
      job-payload-prefix: execution:complexity-profile:job:
      status-ttl-seconds: 3600
      result-ttl-seconds: 3600
      queued-job-max-age-seconds: 3600
    harness:
      use-child-jvm: true
      child-jvm-grace-ms: 15000
      cooperative-in-process-timeouts: false
    worker:
      count: ${EXECUTION_COMPLEXITY_PROFILE_WORKER_COUNT:2}
      queue-capacity: ${EXECUTION_COMPLEXITY_PROFILE_QUEUE_CAPACITY:50}
    limits:
      max-cases: 32
      max-warmups-per-case: 10
      max-measured-repeats-per-case: 20
      max-source-bytes: 65536
      per-invocation-timeout-ms: ${EXECUTION_COMPLEXITY_PROFILE_INVOCATION_TIMEOUT_MS:5000}
      max-total-profile-ms: ${EXECUTION_COMPLEXITY_PROFILE_MAX_TOTAL_MS:120000}
    sandbox:
      backend: ${EXECUTION_COMPLEXITY_PROFILE_SANDBOX_BACKEND:local-process}
      production-verified: ${EXECUTION_COMPLEXITY_PROFILE_PRODUCTION_VERIFIED:false}
      trusted-development-only: true
      job-service-account-name: ${EXECUTION_COMPLEXITY_PROFILE_JOB_SA:cxe-complexity-profile-executor}
      max-concurrent-jobs: ${EXECUTION_COMPLEXITY_PROFILE_MAX_CONCURRENT_JOBS:4}
      job-active-deadline-seconds: ${EXECUTION_COMPLEXITY_PROFILE_JOB_ACTIVE_DEADLINE_SECONDS:180}
      job-completion-timeout-seconds: ${EXECUTION_COMPLEXITY_PROFILE_JOB_COMPLETION_TIMEOUT_SECONDS:200}
      ttl-seconds-after-finished: ${EXECUTION_COMPLEXITY_PROFILE_JOB_TTL_SECONDS:300}
      termination-grace-period-seconds: ${EXECUTION_COMPLEXITY_PROFILE_JOB_TERMINATION_GRACE_SECONDS:5}
      sandbox-redis-key-prefix: execution:complexity-profile:sandbox:
      trusted-oracle-key-prefix: execution:complexity-profile:trusted:oracle:
      slot-key-prefix: execution:complexity-profile:slot:
      slot-ttl-grace-seconds: 120
      sandbox-redis-username: ${EXECUTION_COMPLEXITY_PROFILE_SANDBOX_REDIS_USERNAME:}
      sandbox-redis-password: ${EXECUTION_COMPLEXITY_PROFILE_SANDBOX_REDIS_PASSWORD:}
      sandbox-redis-credentials-secret-name: ${EXECUTION_COMPLEXITY_PROFILE_SANDBOX_REDIS_SECRET_NAME:cxe-complexity-profile-sandbox-redis}
      sandbox-redis-username-secret-key: username
      sandbox-redis-password-secret-key: password
      require-sandbox-redis-credentials: ${EXECUTION_COMPLEXITY_PROFILE_SANDBOX_REDIS_REQUIRED:true}
      job-resources:
        cpu-request: ${EXECUTION_COMPLEXITY_PROFILE_CPU_REQUEST:500m}
        memory-request: ${EXECUTION_COMPLEXITY_PROFILE_MEMORY_REQUEST:512Mi}
        cpu-limit: ${EXECUTION_COMPLEXITY_PROFILE_CPU_LIMIT:1}
        memory-limit: ${EXECUTION_COMPLEXITY_PROFILE_MEMORY_LIMIT:768Mi}
        ephemeral-storage-request: ${EXECUTION_COMPLEXITY_PROFILE_EPHEMERAL_REQUEST:256Mi}
        ephemeral-storage-limit: ${EXECUTION_COMPLEXITY_PROFILE_EPHEMERAL_LIMIT:512Mi}
  playground:
    enabled: ${EXECUTION_PLAYGROUND_ENABLED:false}
    execution-timeout-seconds: ${EXECUTION_PLAYGROUND_TIMEOUT_SECONDS:5}
    max-combined-output-bytes: ${EXECUTION_PLAYGROUND_MAX_OUTPUT_BYTES:65536}
    max-compiler-output-bytes: ${EXECUTION_PLAYGROUND_MAX_COMPILER_OUTPUT_BYTES:32768}
    max-source-bytes: ${EXECUTION_PLAYGROUND_MAX_SOURCE_BYTES:32768}
    max-stdin-bytes: ${EXECUTION_PLAYGROUND_MAX_STDIN_BYTES:8192}
    sandbox:
      backend: ${EXECUTION_PLAYGROUND_SANDBOX_BACKEND:local-process}
      production-verified: ${EXECUTION_PLAYGROUND_SANDBOX_PRODUCTION_VERIFIED:false}
      job-service-account-name: ${EXECUTION_PLAYGROUND_JOB_SA:cxe-playground-executor}
      run-as-user: ${EXECUTION_PLAYGROUND_RUN_AS_USER:65532}
      run-as-group: ${EXECUTION_PLAYGROUND_RUN_AS_GROUP:65532}
      fs-group: ${EXECUTION_PLAYGROUND_FS_GROUP:65532}
      harden-all-execution-jobs: ${EXECUTION_HARDEN_ALL_JOBS:false}
  runtime:
    compilation-timeout-seconds: ${EXECUTION_COMPILATION_TIMEOUT_SECONDS:30}
    memory-soft-limit-mb: ${EXECUTION_MEMORY_SOFT_LIMIT_MB:256}
    extra-classpath: ${EXECUTION_EXTRA_CLASSPATH:}
    languages:
      java:
        compile: ${EXECUTION_JAVA_COMPILE_COMMAND:javac -J-XX:ReservedCodeCacheSize=64m -J-Xmx128m}
        run: ${EXECUTION_JAVA_RUN_COMMAND:java -XX:ReservedCodeCacheSize=64m -Xmx128m}
      python:
        run: ${EXECUTION_PYTHON_RUN_COMMAND:python3}
  kubernetes:
    namespace: ${KUBERNETES_NAMESPACE:default}
    job-image: ${KUBERNETES_JOB_IMAGE:}
    image-pull-policy: ${KUBERNETES_JOB_IMAGE_PULL_POLICY:IfNotPresent}
    service-account-name: ${KUBERNETES_SERVICE_ACCOUNT_NAME:}
    active-deadline-seconds: ${KUBERNETES_JOB_ACTIVE_DEADLINE_SECONDS:30}
    job-completion-timeout-seconds: ${KUBERNETES_JOB_COMPLETION_TIMEOUT_SECONDS:40}
    result-poll-interval-millis: ${KUBERNETES_JOB_RESULT_POLL_INTERVAL_MILLIS:1000}
    max-attempts: ${KUBERNETES_JOB_MAX_ATTEMPTS:2}
    retry-delay-millis: ${KUBERNETES_JOB_RETRY_DELAY_MILLIS:1000}
    max-payload-bytes: ${KUBERNETES_JOB_MAX_PAYLOAD_BYTES:65536}
    ttl-seconds-after-finished: ${KUBERNETES_JOB_TTL_SECONDS_AFTER_FINISHED:120}
    delete-job-after-read: ${KUBERNETES_JOB_DELETE_AFTER_READ:true}
    resources:
      requests:
        cpu: ${KUBERNETES_JOB_CPU_REQUEST:250m}
        memory: ${KUBERNETES_JOB_MEMORY_REQUEST:256Mi}
      limits:
        cpu: ${KUBERNETES_JOB_CPU_LIMIT:500m}
        memory: ${KUBERNETES_JOB_MEMORY_LIMIT:256Mi}

# External Services
services:
  problem:
    base-url: ${PROBLEM_SERVICE_URL:http://problem-service:8084}

# Logging
logging:
  level:
    xyz.hrishabhjoshi.codeexecutionengine: INFO
    org.springframework.data.redis: WARN
    org.springframework.data.redis.core.RedisConnectionUtils: WARN
    io.lettuce: WARN
    org.springframework: INFO
